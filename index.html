<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Young Economics Indonesia</title>

<meta name="description" content="Young Economics Indonesia — memahami ekonomi dengan cara yang sederhana, relevan, dan modern.">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root{
    --black:#050505;
    --dark:#101010;
    --cream:#f5f0e6;
    --gold:#d8b46a;
    --gold-dark:#9f7832;
    --white:#ffffff;
    --gray:#999;
    --line:#ddd5c6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--cream);
    color:var(--black);
    font-family:'DM Sans',sans-serif;
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1150px;
    margin:auto;
}

/* ================= HEADER ================= */

header{
    background:var(--black);
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    border-bottom:1px solid #222;
}

.header{
    min-height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:'Playfair Display',serif;
    font-size:28px;
}

.logo span{
    color:var(--gold);
}

.instagram{
    background:var(--cream);
    color:var(--black);
    border:1px solid var(--gold);
    padding:13px 20px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.7px;
    transition:.3s;
}

.instagram:hover{
    background:var(--gold);
    transform:translateY(-2px);
}

nav{
    background:var(--gold);
}

.nav{
    display:flex;
    justify-content:center;
    gap:45px;
    padding:15px;
    overflow-x:auto;
}

.nav a{
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
}

/* ================= HERO ================= */

.hero{
    background:var(--black);
    color:white;
    padding:100px 0;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.25fr .75fr;
    gap:65px;
    align-items:center;
}

.label{
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    margin-bottom:20px;
}

.hero h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(48px,7vw,82px);
    line-height:1.02;
}

.hero h1 span{
    color:var(--gold);
}

.hero-description{
    color:#aaa;
    max-width:590px;
    margin-top:25px;
    font-size:17px;
}

.hero-button{
    display:inline-block;
    margin-top:32px;
    padding:15px 25px;
    background:var(--gold);
    color:var(--black);
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
}

.hero-card{
    background:#101010;
    border:1px solid #333;
    padding:35px;
}

.hero-card h2{
    font-family:'Playfair Display',serif;
    font-size:34px;
    line-height:1.15;
    margin:15px 0;
}

.hero-card p{
    color:#aaa;
    font-size:14px;
}

/* ================= SECTION ================= */

section{
    padding:90px 0;
}

.section-label{
    color:var(--gold-dark);
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
}

.section-title{
    font-family:'Playfair Display',serif;
    font-size:48px;
    line-height:1.1;
    margin:15px 0 45px;
}

/* ================= ECONOMICS 101 ================= */

.economics101{
    background:var(--cream);
}

.intro{
    max-width:700px;
    color:#666;
    margin-top:-25px;
    margin-bottom:45px;
}

.lessons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.lesson{
    background:white;
    border:1px solid var(--line);
    padding:32px;
    transition:.3s;
}

.lesson:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
}

.lesson-number{
    color:var(--gold-dark);
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
}

.lesson h3{
    font-family:'Playfair Display',serif;
    font-size:28px;
    margin:12px 0;
}

.lesson p{
    color:#666;
    font-size:14px;
}

.lesson a{
    display:inline-block;
    margin-top:20px;
    color:var(--gold-dark);
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
}

/* ================= LESSON DETAIL ================= */

.detail{
    background:#111;
    color:white;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.detail-card{
    border:1px solid #333;
    padding:35px;
}

.detail-card h3{
    font-family:'Playfair Display',serif;
    font-size:30px;
    margin:12px 0 15px;
}

.detail-card p{
    color:#aaa;
}

.key{
    display:inline-block;
    margin-top:22px;
    padding:9px 13px;
    background:var(--gold);
    color:var(--black);
    font-size:11px;
    font-weight:700;
}

/* ================= ECONOMICS IN 30 SECONDS ================= */

.seconds{
    background:var(--gold);
}

.seconds-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:55px;
    align-items:center;
}

.seconds h2{
    font-family:'Playfair Display',serif;
    font-size:52px;
    line-height:1.05;
}

.seconds p{
    margin-top:20px;
    max-width:550px;
}

.formula{
    background:var(--black);
    color:white;
    padding:42px;
}

.formula small{
    color:var(--gold);
    letter-spacing:2px;
}

.formula strong{
    display:block;
    font-family:'Playfair Display',serif;
    font-size:42px;
    margin:18px 0;
}

/* ================= TOPICS ================= */

.topics{
    background:white;
}

.topic-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.topic{
    border:1px solid var(--line);
    padding:30px 25px;
}

.topic-number{
    color:var(--gold-dark);
    font-size:12px;
    font-weight:700;
}

.topic h3{
    font-family:'Playfair Display',serif;
    font-size:26px;
    margin:15px 0 10px;
}

.topic p{
    color:#666;
    font-size:14px;
}

/* ================= QUIZ ================= */

.quiz{
    background:var(--cream);
}

.quiz-box{
    max-width:780px;
    margin:auto;
    background:white;
    border:1px solid var(--line);
    padding:45px;
}

.quiz-box h2{
    font-family:'Playfair Display',serif;
    font-size:38px;
    margin-bottom:30px;
}

.question{
    font-size:19px;
    font-weight:600;
    margin-bottom:22px;
}

.answers{
    display:grid;
    gap:12px;
}

.answer{
    background:white;
    border:1px solid #ccc;
    padding:15px;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    transition:.25s;
}

.answer:hover{
    background:var(--gold);
    border-color:var(--gold);
}

.quiz-result{
    margin-top:22px;
    font-weight:700;
}

.quiz-progress{
    color:#888;
    margin-top:18px;
    font-size:13px;
}

/* ================= COMMUNITY ================= */

.community{
    background:var(--black);
    color:white;
    text-align:center;
}

.community h2{
    max-width:800px;
    margin:15px auto 20px;
    font-family:'Playfair Display',serif;
    font-size:54px;
    line-height:1.08;
}

.community p{
    max-width:620px;
    margin:auto;
    color:#aaa;
}

.community-button{
    display:inline-block;
    margin-top:32px;
    padding:16px 27px;
    background:var(--cream);
    color:var(--black);
    border:1px solid var(--gold);
    font-weight:700;
    letter-spacing:1px;
    transition:.3s;
}

.community-button:hover{
    background:var(--gold);
    transform:translateY(-2px);
}

/* ================= FOOTER ================= */

footer{
    background:var(--black);
    color:#777;
    border-top:1px solid #222;
    text-align:center;
    padding:30px;
    font-size:13px;
}

footer strong{
    color:white;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .hero-grid,
    .seconds-grid,
    .detail-grid{
        grid-template-columns:1fr;
    }

    .lessons{
        grid-template-columns:1fr;
    }

    .topic-grid{
        grid-template-columns:1fr 1fr;
    }

    .hero{
        padding:70px 0;
    }

    .hero h1{
        font-size:50px;
    }

    .community h2{
        font-size:40px;
    }

    .nav{
        justify-content:flex-start;
    }
}

@media(max-width:500px){

    .topic-grid{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:22px;
    }

    .instagram{
        padding:10px 12px;
        font-size:8px;
    }

    .section-title{
        font-size:38px;
    }

    .quiz-box{
        padding:28px 20px;
    }
}
</style>
</head>
